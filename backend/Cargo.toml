[package]
name = "casivon-backend"
version = "0.1.0"
edition = "2021"
# Two binaries: the server, and `openapi` which dumps the spec for the frontend
# type generator. Named here so a bare `cargo run` still starts the server.
default-run = "casivon-backend"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "migrate",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
# Password reset tokens are hashed before storage. A fast hash is the right
# choice here (unlike for passwords): the token is 256 bits of randomness, so
# there is no dictionary to slow an attacker down to.
sha2 = "0.10"

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Money. With the plain `serde` feature a Decimal serializes to a JSON *string*,
# which is what we want on the wire — no float rounding on the way to the client.
rust_decimal = { version = "1.33", features = ["serde", "db-postgres"] }
rust_decimal_macros = "1.33"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Redis
redis = { version = "0.24", features = ["tokio-comp"] }

# Async trait
async-trait = "0.1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1-native-tls", "hostname"] }

# Object storage for uploaded receipts, spoken to over the S3 API so the same
# code addresses MinIO in development and a managed bucket in production.
#
# native-tls rather than rustls: sqlx and lettre above already link native-tls,
# and a second TLS stack in one binary is two sets of root certificates to keep
# straight for no benefit. `default-features = false` because the default set
# drags in a whole second async runtime.
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-native-tls"] }

[dev-dependencies]
# Integration tests drive the router in-process with `ServiceExt::oneshot`,
# so there is no socket to bind and no port to collide on.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
